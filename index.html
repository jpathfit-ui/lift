<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<style>
:root{--bg:#0b0d10;--card:#151a20;--card2:#1d242c;--line:#27303a;--tx:#eef2f6;--mut:#8a97a6;--ac:#3b9cff;--ok:#2ecc71;--bad:#ff5a5f;--warn:#f5a623}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(12px + env(safe-area-inset-top)) 0 calc(150px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
h1{font-size:26px;margin:6px 0 12px}h2{font-size:18px;margin:18px 0 8px}
.mut{color:var(--mut)}.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
button{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{opacity:.7}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ok{background:var(--ok);border-color:var(--ok);color:#04210f}
.bad{color:var(--bad)}.ghost{background:none;border-color:transparent;color:var(--ac)}
.full{width:100%}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
input,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;min-width:0}
input[type=number]{text-align:center}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#10141aee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px 10px;color:var(--mut);font-size:12px}
.tabs button b{display:block;font-size:20px;font-weight:400}
.tabs button.on{color:var(--ac)}
.sethead,.setrow{display:grid;gap:6px;align-items:center;margin:5px 0}
.sethead{color:var(--mut);font-size:12px;text-align:center}
.setrow.done{background:#2ecc7122;border-radius:10px;padding:2px 0}
.setrow .n{text-align:center;font-weight:600}
.chk{padding:8px 0;text-align:center}
.pill{display:inline-block;background:var(--card2);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--mut);margin-right:4px}
.pr{color:var(--warn)}
#rest{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));background:var(--ac);border-radius:14px;padding:10px 14px;z-index:6;display:none;box-shadow:0 6px 20px #0008}
#rest .t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
#rest button{background:#ffffff30;border:0;color:#fff;padding:8px 12px}
.modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px;border:1px solid var(--line)}
textarea{width:100%;min-height:120px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px monospace}
svg text{fill:var(--mut);font-size:10px}
.sticky{background:#ffe97a;color:#3a3000;border-radius:8px;padding:8px;margin:8px 0;box-shadow:0 2px 6px #0006}
.stbl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 26px;gap:1px 6px;margin-top:6px;align-items:center}
.stbl input{background:transparent;color:#3a3000;border:0;border-bottom:1px solid #00000022;border-radius:0;padding:7px 2px;font-size:15px}
.stbl input.sl{font-weight:600;font-size:14px}
.stbl input.sv{text-align:right;background:#fff6b8;border-radius:6px;border-bottom:0;padding:7px 8px}
.stbl input::placeholder{color:#3a300060}
.stbl .sx{background:none;border:0;color:#3a300099;padding:4px;font-size:13px}
.sticky .sadd{background:none;border:0;color:#6b5300;padding:8px 0 2px;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="rest"><div class="row sp"><div><div class="sm">Rest</div><div class="t" id="rt">0:00</div></div>
<div class="row"><button data-a="rest-" >−15</button><button data-a="rest+">+15</button><button data-a="restx">Skip</button></div></div></div>
<div class="tabs" id="tabs"></div>
<div id="modal"></div>

<script>
// ---------- storage ----------
const KEY='lift.v1';
let S;
const uid=()=>Math.random().toString(36).slice(2,10);
const TYPES={wr:{n:'Weight × reps',a:'WEIGHT',b:'REPS'},bw:{n:'Bodyweight (+ added weight)',a:'+WEIGHT',b:'REPS'},reps:{n:'Reps only',b:'REPS'},time:{n:'Duration',b:'SECONDS'},dist:{n:'Distance + time',a:'KM',b:'MIN'}};
function seed(){
 const L=[['Bench Press (Barbell)','wr','Chest'],['Incline Bench Press (Dumbbell)','wr','Chest'],['Overhead Press (Barbell)','wr','Shoulders'],['Lateral Raise (Dumbbell)','wr','Shoulders'],['Triceps Pushdown','wr','Arms'],['Bicep Curl (Dumbbell)','wr','Arms'],['Squat (Barbell)','wr','Legs'],['Front Squat','wr','Legs'],['Romanian Deadlift','wr','Legs'],['Deadlift (Barbell)','wr','Back'],['Leg Press (Machine)','wr','Legs'],['Leg Extension (Machine)','wr','Legs'],['Leg Curl (Machine)','wr','Legs'],['Calf Raise (Machine)','wr','Legs'],['Flat Chest Press (Machine)','wr','Chest'],['Incline Chest Press (Machine)','wr','Chest'],['Shoulder Press (Machine)','wr','Shoulders'],['Pec Fly (Machine)','wr','Chest'],['Rear Delt Fly (Machine)','wr','Shoulders'],['Seated Row (Machine)','wr','Back'],['Assisted Pull Up (Machine)','wr','Back'],['Bicep Curl (Machine)','wr','Arms'],['Triceps Extension (Machine)','wr','Arms'],['Hip Abduction (Machine)','wr','Glutes'],['Hip Adduction (Machine)','wr','Legs'],['Ab Crunch (Machine)','wr','Core'],['Treadmill','dist','Cardio',1],['Elliptical','dist','Cardio',1],['Stationary Bike','dist','Cardio',1],['Stair Climber','dist','Cardio',1],['Bent Over Row (Barbell)','wr','Back'],['Seated Cable Row','wr','Back'],['Lat Pulldown (Machine)','wr','Back'],['Hip Thrust','wr','Glutes'],['Pull Up','bw','Back'],['Chin Up','bw','Back'],['Dip','bw','Chest'],['Push Up','reps','Chest'],['Bodyweight Squat','reps','Legs'],['Lunge','reps','Legs'],['Burpee','reps','Full body'],['Sit Up','reps','Core'],['Plank','time','Core'],['Wall Sit','time','Legs'],['Dead Hang','time','Back'],['Running','dist','Cardio'],['Cycling','dist','Cardio'],['Rowing Machine','dist','Cardio',1],['Walking','dist','Cardio'],['Jump Rope','time','Cardio']];
 return L.map(x=>({id:uid(),name:x[0],type:x[1],muscle:x[2],machine:!!(x[3]||/\(machine\)/i.test(x[0]))}));
}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('Storage unavailable – use Export to keep data')}}}
S=load()||{exercises:seed(),routines:[],workouts:[],active:null,settings:{unit:'lb',rest:90}};
const ex=id=>S.exercises.find(e=>e.id===id)||{name:'(deleted)',type:'wr'};
const unit=()=>S.settings.unit;
const BRANDS=['Any','Life Fitness','Precor','Matrix','Hammer Strength MTS','Hammer Strength Plate Loaded'];
const isMachine=x=>!!x.machine;
const brandOf=e=>isMachine(e)?(e.brand||'Any'):'Any';
const defaultSettings=x=>isMachine(x)?[{k:'Pin position',v:''},{k:'Seat height',v:''}]:[];
function getSettings(x,b){
 x.settings=x.settings||{};
 if(!x.settings[b]){const old=(x.notes||{})[b];x.settings[b]=defaultSettings(x);if(old)x.settings[b].push({k:'Notes',v:old})}
 return x.settings[b]}
const hasNote=x=>Object.values(x.settings||{}).some(r=>r.some(s=>s.v))||Object.values(x.notes||{}).some(Boolean);
const entryBrand=e=>e.brand||'Any';
const ekey=e=>e.ex+'|'+entryBrand(e);
function applyMeta(e,brand,note){
 if(brand){e.machine=true;e.brand=brand}
 if(note){const rows=getSettings(e,brand||brandOf(e));const r=rows.find(r=>r.k==='Notes');if(r)r.v=note;else rows.push({k:'Notes',v:note})}
}

// ---------- helpers ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const fmtT=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${m}:${String(r).padStart(2,'0')}`};
const fmtD=t=>new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;z-index:20;font-size:14px';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function setLabel(t,s){
 if(t==='wr')return `${s.a||0} ${unit()} × ${s.b||0}`;
 if(t==='bw')return s.a?`+${s.a} ${unit()} × ${s.b||0}`:`${s.b||0} reps`;
 if(t==='reps')return `${s.b||0} reps`;
 if(t==='time')return fmtT(s.b||0);
 return `${s.a||0} km · ${s.b||0} min`;
}
const e1rm=(w,r)=>r<=0?0:(r===1?w:w*(1+r/30));
function setScore(t,s){ // main comparable metric per set
 if(t==='wr')return e1rm(num(s.a),num(s.b));
 if(t==='bw')return num(s.b);
 if(t==='reps'||t==='time')return num(s.b);
 return num(s.a);
}
function lastPerformance(exId,brand){
 brand=brand||'Any';
 for(let i=S.workouts.length-1;i>=0;i--){const e=S.workouts[i].entries.find(x=>x.ex===exId&&entryBrand(x)===brand&&x.sets.some(s=>s.done));if(e)return e.sets.filter(s=>s.done)}
 return null;
}
function bestEver(exId,brand){brand=brand||'Any';let b=0;const t=ex(exId).type;S.workouts.forEach(w=>w.entries.forEach(e=>{if(e.ex===exId&&entryBrand(e)===brand)e.sets.forEach(s=>{if(s.done)b=Math.max(b,setScore(t,s))})}));return b}

// ---------- audio / rest ----------
let rest={end:0,total:0},restTick=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(actx.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec};$('#rest').style.display='block';clearInterval(restTick);restTick=setInterval(tickRest,250);tickRest()}
function tickRest(){const left=(rest.end-Date.now())/1000;if(left<=0){stopRest();beep();toast('Rest over');return}$('#rt').textContent=fmtT(Math.ceil(left))}
function stopRest(){clearInterval(restTick);$('#rest').style.display='none'}
$('#rest').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;if(a==='rest+')rest.end+=15000;if(a==='rest-')rest.end-=15000;if(a==='restx')stopRest();tickRest&&$('#rest').style.display!=='none'&&tickRest()});

// ---------- view state ----------
let tab='workout',histOpen=null,exSel=null,exFilter='',statEx=null,pickerFor=null;
const TABS=[['workout','🏋️','Workout'],['history','🕘','History'],['exercises','📋','Exercises'],['stats','📈','Stats']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${tab===t[0]?'on':''}"><b>${t[1]}</b>${t[2]}</button>`).join('')}
function render(){renderTabs();const a=$('#app');a.innerHTML={workout:vWorkout,history:vHistory,exercises:vExercises,stats:vStats}[tab]();if(tab==='stats')drawChart()}

// ---------- workout tab ----------
let elapsedTimer=null;
function vWorkout(){
 const w=S.active;
 if(!w){
  return `<h1>Workout</h1>
  <button class="pri full" data-a="start-empty" style="padding:14px">Start empty workout</button>
  <div class="row sp"><h2>Routines</h2><div class="row"><button class="ghost" data-a="import-routines">Import</button><button class="ghost" data-a="new-routine">+ New</button></div></div>
  ${S.routines.length?S.routines.map(r=>`<div class="card"><div class="row sp"><b>${esc(r.name)}</b><div class="row"><button class="ghost" data-a="edit-routine" data-id="${r.id}">Edit</button></div></div>
   <div class="mut sm" style="margin:4px 0 10px">${r.items.map(i=>esc(ex(i.ex).name)+' '+i.sets+(i.reps?'×'+esc(i.reps):' sets')).join(', ')||'No exercises'}</div>
   <button class="full" data-a="start-routine" data-id="${r.id}">Start routine</button></div>`).join(''):'<p class="mut">No routines yet. Create one, or finish a workout and save it as a routine.</p>'}
  <h2>Settings</h2>
  <div class="card"><div class="row sp"><span>Units</span><div class="row"><button data-a="unit" data-v="lb" class="${unit()==='lb'?'pri':''}">lb</button><button data-a="unit" data-v="kg" class="${unit()==='kg'?'pri':''}">kg</button></div></div>
  <div class="row sp" style="margin-top:10px"><span>Default rest (sec)</span><input type="number" inputmode="numeric" style="width:90px" value="${S.settings.rest}" data-f="restdef"></div></div>`;
 }
 const total=w.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
 let vol=0;w.entries.forEach(e=>{const t=ex(e.ex).type;e.sets.forEach(s=>{if(s.done&&(t==='wr'||t==='bw'))vol+=num(s.a)*num(s.b)})});
 return `<div class="row sp"><h1 style="margin:6px 0">${esc(w.name)}</h1><button class="ok" data-a="finish">Finish</button></div>
 <div class="mut sm" style="margin-bottom:8px">⏱ <span id="elapsed">${fmtT((Date.now()-w.start)/1000)}</span> · ${total} sets · ${Math.round(vol)} ${unit()} volume</div>
 ${w.entries.map((e,ei)=>vEntry(e,ei)).join('')}
 <button class="pri full" data-a="add-ex" style="margin-top:8px">+ Add exercise</button>
 <button class="full bad" data-a="cancel" style="margin-top:8px">Cancel workout</button>`;
}
function cols(t){const T=TYPES[t];return T.a?'28px 1fr 1fr 1fr 40px':'28px 1fr 1fr 40px'}
function vEntry(e,ei){
 const x=ex(e.ex),T=TYPES[x.type]||TYPES.wr;const eb=entryBrand(e),prev=lastPerformance(e.ex,eb)||[];
 const head=`<div class="sethead" style="grid-template-columns:${cols(x.type)}"><span>SET</span><span>PREVIOUS</span>${T.a?`<span>${T.a==='WEIGHT'||T.a==='+WEIGHT'?T.a+' ('+unit().toUpperCase()+')':T.a}</span>`:''}<span>${T.b}</span><span>✓</span></div>`;
 return `<div class="card"><div class="row sp"><b style="color:var(--ac)">${esc(x.name)}</b><button class="ghost" data-a="rm-ex" data-ei="${ei}">✕</button></div>
 ${e.target?`<div class="sm mut">Target: ${esc(e.target)}</div>`:''}
 <div class="sticky"><div class="row sp"><span class="sm"><b>${isMachine(x)?'Machine settings':'Settings'}</b></span>
  ${isMachine(x)?`<select data-f="brand" data-ei="${ei}" style="width:auto;max-width:200px;padding:3px 6px;font-size:13px;background:#00000014;color:#3a3000;border-color:#00000026">${BRANDS.map(b=>`<option value="${b}" ${eb===b?'selected':''}>${b==='Any'?'Unspecified':b}</option>`).join('')}</select>`:''}</div>
  <div class="stbl">${getSettings(x,eb).map((r,i)=>`<input class="sl" data-f="slabel" data-id="${x.id}" data-brand="${esc(eb)}" data-i="${i}" value="${esc(r.k)}" placeholder="Setting"><input class="sv" data-f="sval" data-id="${x.id}" data-brand="${esc(eb)}" data-i="${i}" value="${esc(r.v)}" placeholder="–"><button class="sx" data-a="srm" data-id="${x.id}" data-brand="${esc(eb)}" data-i="${i}" aria-label="Remove">✕</button>`).join('')}</div>
  <button class="sadd" data-a="sadd" data-id="${x.id}" data-brand="${esc(eb)}">+ Add setting</button></div>
 ${head}${e.sets.map((s,si)=>{const p=prev[si];return `<div class="setrow ${s.done?'done':''}" style="grid-template-columns:${cols(x.type)}">
  <span class="n">${si+1}</span><span class="mut sm" style="text-align:center">${p?setLabel(x.type,p):'–'}</span>
  ${T.a?`<input type="number" inputmode="decimal" data-f="set" data-ei="${ei}" data-si="${si}" data-k="a" value="${s.a??''}" placeholder="${p?.a??''}">`:''}
  <input type="number" inputmode="decimal" data-f="set" data-ei="${ei}" data-si="${si}" data-k="b" value="${s.b??''}" placeholder="${p?.b??''}">
  <button class="chk ${s.done?'ok':''}" data-a="done" data-ei="${ei}" data-si="${si}">✓</button></div>`}).join('')}
 <div class="row" style="margin-top:8px"><button class="grow" data-a="add-set" data-ei="${ei}">+ Add set</button>${e.sets.length>1?`<button data-a="rm-set" data-ei="${ei}">− Remove</button>`:''}</div></div>`;
}
function newEntry(exId,n=3,target,brand){return {ex:exId,brand:brand||brandOf(ex(exId)),target:target||'',sets:Array.from({length:n},()=>({a:'',b:'',done:false}))}}
function startWorkout(name,items){
 S.active={id:uid(),name,start:Date.now(),entries:items.map(i=>newEntry(i.ex,i.sets,i.reps,i.brand))};save();render();startElapsed();
}

// ---------- import ----------
const norm=s=>{s=String(s).toLowerCase();return s.replace(/\([^)]*\)/g,'').replace(/[^a-z0-9]/g,'')+(/\(\s*machine\s*\)/.test(s)?'#m':'')};
function migrate(){
 const RN={'Leg Press':1,'Leg Curl':1,'Lat Pulldown':1,'Calf Raise':1};
 S.exercises.forEach(x=>{
  if(RN[x.name]){x.name+=' (Machine)';x.machine=true}
  if(x.machine===undefined)x.machine=/\(machine\)|treadmill|elliptical|stationary bike|stair climber|rowing machine/i.test(x.name);
 });
 if(!S.mig2){const have=new Set(S.exercises.map(e=>norm(e.name)));seed().filter(e=>e.machine&&!have.has(norm(e.name))).forEach(e=>S.exercises.push(e));S.mig2=1}
 save();
}
function guessType(n){n=n.toLowerCase();
 if(/plank|hang|hold|wall sit|jump rope|stretch|bridge/.test(n))return 'time';
 if(/\brun|jog|bike|cycl|rowing|swim|walk|ski|elliptical|treadmill/.test(n))return 'dist';
 if(/pull.?up|chin.?up|dip\b|muscle.?up/.test(n))return 'bw';
 if(/push.?up|sit.?up|crunch|burpee|lunge|bodyweight|jumping jack|mountain climber/.test(n))return 'reps';
 return 'wr'}
function findOrMakeEx(name,type,stats){
 const k=norm(name);
 let e=S.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase())||S.exercises.find(x=>norm(x.name)===k);
 if(!e&&!k.endsWith('#m'))e=S.exercises.find(x=>norm(x.name)===k+'#m');
 if(e)return e;
 e={id:uid(),name,type:TYPES[type]?type:guessType(name),muscle:'',machine:/\(\s*machine\s*\)/i.test(name)};S.exercises.push(e);stats.newEx++;return e}
function parseExLine(line){
 line=line.replace(/^\s*(?:[-*•]|\d+[.)])\s+/,'').trim();
 let m=line.match(/^(.+?)[\s:|–—-]+(\d+)\s*[x×]\s*([\d]+(?:\s*[-–]\s*\d+)?\s*(?:(?:reps?|sec|s|min|m)\b)?)(.*)$/i), sets,reps,rest;
 if(m){sets=+m[2];reps=m[3].trim();rest=m[4]}
 else{m=line.match(/^(.+?)[\s:|–—-]+(\d+)\s*sets?\b(?:\s*(?:of|x|×|@)?\s*([\d]+(?:\s*[-–]\s*\d+)?\s*(?:(?:reps?|sec|s|min|m)\b)?))?(.*)$/i);
  if(!m)return null;sets=+m[2];reps=(m[3]||'').trim();rest=m[4]}
 const nm=rest.match(/note:\s*(.+)$/i),note=nm?nm[1].trim():'';
 if(nm)rest=rest.slice(0,nm.index);
 const t=(rest.match(/\b(wr|bw|reps|time|dist)\b/i)||[])[1];
 const bm=rest.match(/\b(life\s?fitness|precor|matrix|hammer\s?strength\s?(?:mts|plate(?:\s?loaded)?)|hs\s?mts|hs\s?plate(?:\s?loaded)?|mts|plate\s?loaded)\b/i);
 let brand='';
 if(bm){const s=bm[1].toLowerCase();brand=/life/.test(s)?'Life Fitness':/precor/.test(s)?'Precor':/matrix/.test(s)?'Matrix':/mts/.test(s)?'Hammer Strength MTS':'Hammer Strength Plate Loaded'}
 return {name:m[1].trim().replace(/[:|]+$/,''),sets:Math.min(Math.max(sets,1),20),reps,type:t&&t.toLowerCase(),brand,note}}
function importText(txt){
 const stats={routines:0,newEx:0};txt=txt.trim();
 if(txt[0]==='['||txt[0]==='{'){
  const j=JSON.parse(txt);const arr=Array.isArray(j)?j:[j];
  arr.forEach(r=>{const items=(r.exercises||[]).map(x=>{const e=findOrMakeEx(x.name,x.type,stats);applyMeta(e,x.brand,x.note);return {ex:e.id,sets:Math.max(1,+x.sets||3),reps:x.reps?String(x.reps):'',brand:x.brand||''}});
   if(items.length){S.routines.push({id:uid(),name:r.name||'Imported',items});stats.routines++}});
  save();return stats}
 txt.split(/\n\s*\n/).forEach(block=>{
  let name='',items=[];
  block.split('\n').map(l=>l.trim()).filter(Boolean).forEach(l=>{
   const p=parseExLine(l);
   if(p){const e=findOrMakeEx(p.name,p.type,stats);applyMeta(e,p.brand,p.note);items.push({ex:e.id,sets:p.sets,reps:p.reps,brand:p.brand||''})}
   else if(!name)name=l.replace(/^#+\s*|[:*]+$/g,'').trim();
  });
  if(items.length){S.routines.push({id:uid(),name:name||'Imported',items});stats.routines++}
 });
 save();return stats}
function importForm(){
 modal(`<h2>Import routines</h2>
 <p class="sm mut" style="margin-top:0">Paste a workout. One routine per block, separated by a blank line: a title line, then one exercise per line.</p>
 <textarea id="ta" placeholder="Push Day&#10;Bench Press (Barbell) - 4x6-8&#10;Overhead Press - 3x8&#10;Push Up - 3x15&#10;Plank - 3x45s time"></textarea>
 <p class="sm mut">Unknown exercises are created automatically. Add <b>time</b>, <b>dist</b>, <b>bw</b>, or <b>reps</b> at the end of a line to set its type; otherwise I guess from the name. You can also add a machine (<b>Precor</b>, <b>Matrix</b>, <b>Life Fitness</b>, <b>Hammer Strength MTS</b>, <b>Hammer Strength Plate Loaded</b>) and <b>note: seat 4, pad 3</b>.</p>
 <div class="row"><button class="grow" data-a="close">Cancel</button><button class="pri grow" data-a="do-import-routines">Import</button></div>`)}
function startElapsed(){clearInterval(elapsedTimer);elapsedTimer=setInterval(()=>{const el=$('#elapsed');if(el&&S.active)el.textContent=fmtT((Date.now()-S.active.start)/1000)},1000)}

function finishWorkout(){
 const w=S.active;
 w.entries.forEach(e=>e.sets=e.sets.filter(s=>s.done));
 w.entries=w.entries.filter(e=>e.sets.length);
 if(!w.entries.length){modal(`<h2>Nothing logged</h2><p class="mut">Mark at least one set with ✓ before finishing.</p><button class="full" data-a="close">OK</button>`);return}
 w.end=Date.now();
 // PR detection against prior
 const prs=[];w.entries.forEach(e=>{const t=ex(e.ex).type,b=bestEver(e.ex,entryBrand(e));const m=Math.max(...e.sets.map(s=>setScore(t,s)));if(m>b&&b>0)prs.push(ex(e.ex).name)});
 S.workouts.push(w);S.active=null;save();stopRest();clearInterval(elapsedTimer);
 modal(`<h2>Workout saved 🎉</h2><p>${fmtT((w.end-w.start)/1000)} · ${w.entries.reduce((n,e)=>n+e.sets.length,0)} sets</p>
 ${prs.length?`<p class="pr">🏆 New personal best: ${prs.map(esc).join(', ')}</p>`:''}
 <div class="row"><button class="grow" data-a="save-as-routine" data-id="${w.id}">Save as routine</button><button class="pri grow" data-a="close">Done</button></div>`);
}

// ---------- history ----------
function vHistory(){
 const ws=[...S.workouts].reverse();
 return `<h1>History</h1>${ws.length?ws.map(w=>{
  const open=histOpen===w.id;
  return `<div class="card"><div class="row sp" data-a="hist-toggle" data-id="${w.id}" style="cursor:pointer"><div><b>${esc(w.name)}</b><div class="mut sm">${fmtD(w.start)} · ${fmtT((w.end-w.start)/1000)}</div></div><span class="mut">${open?'▲':'▼'}</span></div>
  ${open?`<div style="margin-top:8px">${w.entries.map(e=>`<div style="margin:6px 0"><b class="sm">${esc(ex(e.ex).name)}${entryBrand(e)!=='Any'?' · '+esc(entryBrand(e)):''}</b>${e.sets.map((s,i)=>`<div class="sm mut">${i+1}. ${setLabel(ex(e.ex).type,s)}</div>`).join('')}</div>`).join('')}
  <div class="row" style="margin-top:8px"><button class="grow" data-a="repeat" data-id="${w.id}">Repeat</button><button class="bad" data-a="del-workout" data-id="${w.id}">Delete</button></div></div>`
  :`<div class="mut sm" style="margin-top:6px">${w.entries.map(e=>esc(ex(e.ex).name)).join(' · ')}</div>`}</div>`}).join(''):'<p class="mut">Finished workouts show up here.</p>'}`;
}

// ---------- exercises ----------
function vExercises(){
 const f=exFilter.toLowerCase();
 const list=S.exercises.filter(e=>!f||e.name.toLowerCase().includes(f)||(e.muscle||'').toLowerCase().includes(f)).sort((a,b)=>a.name.localeCompare(b.name));
 return `<div class="row sp"><h1>Exercises</h1><button class="pri" data-a="new-ex">+ New</button></div>
 <input placeholder="Search…" value="${esc(exFilter)}" data-f="exfilter">
 ${list.map(e=>`<div class="card row sp" data-a="edit-ex" data-id="${e.id}" style="cursor:pointer"><div><b>${esc(e.name)}</b><div class="mut sm">${esc(e.muscle||'')}${brandOf(e)!=='Any'?' · '+brandOf(e):''}${hasNote(e)?' · has settings note':''}</div></div><span class="pill">${TYPES[e.type]?.n.split(' (')[0]||''}</span></div>`).join('')}`;
}
function exForm(e){
 const isNew=!e;e=e||{name:'',type:'wr',muscle:''};
 modal(`<h2>${isNew?'New':'Edit'} exercise</h2>
 <label class="sm mut">Name</label><input id="xn" value="${esc(e.name)}">
 <label class="sm mut">Type</label><select id="xt">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${e.type===k?'selected':''}>${v.n}</option>`).join('')}</select>
 <label class="sm mut">Body part / category</label><input id="xm" value="${esc(e.muscle||'')}">
 <label class="row" style="margin-top:10px"><input type="checkbox" id="xmach" data-f="machtoggle" style="width:auto" ${e.machine?'checked':''}> <span>Machine exercise (choose machine brand)</span></label>
 <div id="xbwrap" style="display:${e.machine?'block':'none'}"><label class="sm mut">Default machine</label><select id="xb">${BRANDS.map(b=>`<option value="${b}" ${(e.brand||'Any')===b?'selected':''}>${b==='Any'?'Unspecified':b}</option>`).join('')}</select></div>
 <div class="row" style="margin-top:12px">${isNew?'':`<button class="bad" data-a="del-ex" data-id="${e.id}">Delete</button>`}<button class="grow" data-a="close">Cancel</button><button class="pri grow" data-a="save-ex" data-id="${e.id||''}">Save</button></div>`);
}

// ---------- routines ----------
let rEdit=null;
function routineForm(){
 const r=rEdit;
 modal(`<h2>${r.isNew?'New':'Edit'} routine</h2><input id="rn" placeholder="Routine name (e.g. Push Day)" value="${esc(r.name)}">
 ${r.items.map((i,n)=>`<div class="card row sp"><span>${esc(ex(i.ex).name)}</span><div class="row"><input type="number" style="width:56px" value="${i.sets}" data-f="rsets" data-n="${n}"><span class="sm mut">sets</span><button class="ghost" data-a="r-rm" data-n="${n}">✕</button></div></div>`).join('')}
 <button class="full" data-a="r-add">+ Add exercise</button>
 <div class="row" style="margin-top:12px">${r.isNew?'':`<button class="bad" data-a="r-del">Delete</button>`}<button class="grow" data-a="close">Cancel</button><button class="pri grow" data-a="r-save">Save</button></div>`);
}

// ---------- picker ----------
function picker(mode){
 pickerFor=mode;
 modal(`<h2>Choose exercise</h2><input id="pq" placeholder="Search…" data-f="pq"><div id="pl"></div><button class="full" data-a="close" style="margin-top:8px">Cancel</button>`,true);
 pickList('');
}
function pickList(q){
 q=q.toLowerCase();
 $('#pl').innerHTML=S.exercises.filter(e=>!q||e.name.toLowerCase().includes(q)||(e.muscle||'').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>`<div class="card" data-a="pick" data-id="${e.id}" style="cursor:pointer"><b>${esc(e.name)}</b> <span class="mut sm">${esc(e.muscle||'')}</span></div>`).join('')||'<p class="mut">No match.</p>';
}

// ---------- stats ----------
function vStats(){
 const used=[...new Set(S.workouts.flatMap(w=>w.entries.map(ekey)))].filter(k=>S.exercises.some(e=>e.id===k.split('|')[0]));
 const kname=k=>{const [id,b]=k.split('|');return ex(id).name+(b!=='Any'?' · '+b:'')};
 if(!statEx||!used.includes(statEx))statEx=used[0]||null;
 const wk=Date.now()-7*864e5,week=S.workouts.filter(w=>w.start>wk).length;
 return `<h1>Stats</h1>
 <div class="row"><div class="card grow"><div class="mut sm">Workouts</div><b style="font-size:24px">${S.workouts.length}</b></div><div class="card grow"><div class="mut sm">Last 7 days</div><b style="font-size:24px">${week}</b></div></div>
 ${used.length?`<select data-f="statex">${used.map(k=>`<option value="${esc(k)}" ${k===statEx?'selected':''}>${esc(kname(k))}</option>`).join('')}</select>
 <div class="card"><div class="mut sm" id="chartTitle"></div><div id="chart"></div></div><div id="prs"></div>`:'<p class="mut">Log a few workouts to see progress charts.</p>'}
 <h2>Backup</h2><div class="card"><p class="sm mut" style="margin-top:0">Data lives only in this browser. Export regularly.</p>
 <div class="row"><button class="grow" data-a="export">Export</button><button class="grow" data-a="import">Import</button></div></div>`;
}
function drawChart(){
 if(!statEx)return;const [sid,sb]=statEx.split('|'),x=ex(sid),t=x.type;
 const pts=[];S.workouts.forEach(w=>{const e=w.entries.find(e=>e.ex===sid&&entryBrand(e)===sb);if(!e)return;const sc=e.sets.map(s=>setScore(t,s));pts.push({d:w.start,v:Math.max(...sc),vol:e.sets.reduce((n,s)=>n+(t==='wr'||t==='bw'?num(s.a)*num(s.b):num(s.b)),0)})});
 const label={wr:`Estimated 1RM (${unit()})`,bw:'Best set (reps)',reps:'Best set (reps)',time:'Best hold (sec)',dist:'Best distance (km)'}[t];
 $('#chartTitle').textContent=label;
 if(pts.length<2){$('#chart').innerHTML='<p class="mut sm">Need at least 2 sessions to chart.</p>'}
 else{
  const W=520,H=190,P=30,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;
  const X=i=>P+i*(W-P-10)/(pts.length-1),Y=v=>H-P-(v-mn)/rg*(H-P-12);
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%"><polyline fill="none" stroke="#3b9cff" stroke-width="2.5" points="${pts.map((p,i)=>X(i)+','+Y(p.v)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.v)}" r="3.5" fill="#3b9cff"/>`).join('')}
  <text x="2" y="${Y(mx)+3}">${Math.round(mx)}</text><text x="2" y="${Y(mn)+3}">${Math.round(mn)}</text>
  <text x="${P}" y="${H-8}">${new Date(pts[0].d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text x="${W-60}" y="${H-8}">${new Date(pts[pts.length-1].d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text></svg>`;
 }
 // PR list
 let pr='';
 if(t==='wr'){const byReps={};S.workouts.forEach(w=>w.entries.forEach(e=>{if(e.ex===sid&&entryBrand(e)===sb)e.sets.forEach(s=>{const r=num(s.b),wt=num(s.a);if(r&&(!byReps[r]||wt>byReps[r]))byReps[r]=wt})}));
  pr=Object.keys(byReps).map(Number).sort((a,b)=>a-b).slice(0,8).map(r=>`<div class="row sp sm"><span>${r} rep${r>1?'s':''}</span><b>${byReps[r]} ${unit()}</b></div>`).join('')}
 else{const b=bestEver(sid,sb);pr=`<div class="row sp sm"><span>Best</span><b>${Math.round(b*10)/10}</b></div>`}
 $('#prs').innerHTML=`<div class="card"><b>🏆 Records</b><div style="margin-top:6px">${pr}</div></div>`;
}

// ---------- modal ----------
function modal(html,keepInput){$('#modal').innerHTML=`<div class="modal" data-a="bg"><div class="sheet">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}

// ---------- backup ----------
async function doExport(){
 const txt=JSON.stringify(S);
 try{const d=await window.claude?.use('downloads');if(d){await d.save({filename:'lift-backup-'+new Date().toISOString().slice(0,10)+'.json',data:new Blob([txt],{type:'application/json'})});return}}catch(e){}
 modal(`<h2>Export</h2><p class="sm mut">Copy this text and keep it somewhere safe (Notes, email to yourself).</p><textarea id="ta" readonly>${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button class="grow" data-a="copy">Copy</button><button class="pri grow" data-a="close">Done</button></div>`);
}
function doImport(){
 modal(`<h2>Import</h2><p class="sm mut">Paste a backup, or choose a file. This replaces current data.</p><input type="file" id="imf" accept=".json,application/json"><textarea id="ta" style="margin-top:8px"></textarea><div class="row" style="margin-top:8px"><button class="grow" data-a="close">Cancel</button><button class="pri grow" data-a="do-import">Import</button></div>`);
 $('#imf').onchange=async e=>{const f=e.target.files[0];if(f)$('#ta').value=await f.text()};
}

// ---------- events ----------
document.addEventListener('click',e=>{
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo(0,0);return}
 const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,d=el.dataset;
 if(a==='bg'){if(e.target===el)closeModal();return}
 if(a==='close'){closeModal();render();return}
 const w=S.active;
 switch(a){
  case 'start-empty':startWorkout('Workout',[]);break;
  case 'start-routine':{const r=S.routines.find(r=>r.id===d.id);startWorkout(r.name,r.items);break}
  case 'unit':S.settings.unit=d.v;save();render();break;
  case 'finish':finishWorkout();break;
  case 'cancel':modal(`<h2>Discard workout?</h2><div class="row"><button class="grow" data-a="close">Keep</button><button class="grow bad" data-a="cancel-yes">Discard</button></div>`);break;
  case 'cancel-yes':S.active=null;save();stopRest();clearInterval(elapsedTimer);closeModal();render();break;
  case 'add-ex':picker('workout');break;
  case 'rm-ex':w.entries.splice(+d.ei,1);save();render();break;
  case 'add-set':{const en=w.entries[+d.ei];const l=en.sets[en.sets.length-1];en.sets.push({a:'',b:'',done:false});save();render();break}
  case 'rm-set':w.entries[+d.ei].sets.pop();save();render();break;
  case 'done':{
   const en=w.entries[+d.ei],s=en.sets[+d.si],prev=(lastPerformance(en.ex,entryBrand(en))||[])[+d.si];
   if(!s.done){ // autofill from previous if empty
    if(s.b===''&&prev)s.b=prev.b;if(s.a===''&&prev&&prev.a!==undefined)s.a=prev.a;
    if(s.b===''||s.b==null){toast('Enter a value first');return}
    s.done=true;startRest(S.settings.rest);
   }else s.done=false;
   save();render();break}
  case 'new-routine':rEdit={isNew:true,name:'',items:[]};routineForm();break;
  case 'edit-routine':{const r=S.routines.find(r=>r.id===d.id);rEdit={isNew:false,id:r.id,name:r.name,items:r.items.map(i=>({...i}))};routineForm();break}
  case 'r-add':rEdit.name=$('#rn').value;picker('routine');break;
  case 'r-rm':rEdit.name=$('#rn').value;rEdit.items.splice(+d.n,1);routineForm();break;
  case 'r-save':{const n=$('#rn').value.trim()||'Routine';rEdit.name=n;if(rEdit.isNew)S.routines.push({id:uid(),name:n,items:rEdit.items});else{const r=S.routines.find(r=>r.id===rEdit.id);r.name=n;r.items=rEdit.items}save();closeModal();render();break}
  case 'r-del':S.routines=S.routines.filter(r=>r.id!==rEdit.id);save();closeModal();render();break;
  case 'pick':
   if(pickerFor==='workout'){w.entries.push(newEntry(d.id));save();closeModal();render()}
   else{rEdit.items.push({ex:d.id,sets:3});routineForm()}
   break;
  case 'save-as-routine':{const h=S.workouts.find(x=>x.id===d.id);S.routines.push({id:uid(),name:h.name==='Workout'?'Routine '+(S.routines.length+1):h.name,items:h.entries.map(e=>({ex:e.ex,sets:e.sets.length,brand:entryBrand(e)}))});save();toast('Routine saved');closeModal();render();break}
  case 'hist-toggle':histOpen=histOpen===d.id?null:d.id;render();break;
  case 'repeat':{if(S.active){toast('Finish current workout first');break}const h=S.workouts.find(x=>x.id===d.id);tab='workout';startWorkout(h.name,h.entries.map(e=>({ex:e.ex,sets:e.sets.length,brand:entryBrand(e)})));break}
  case 'del-workout':modal(`<h2>Delete this workout?</h2><div class="row"><button class="grow" data-a="close">Cancel</button><button class="grow bad" data-a="del-workout-yes" data-id="${d.id}">Delete</button></div>`);break;
  case 'del-workout-yes':S.workouts=S.workouts.filter(x=>x.id!==d.id);save();closeModal();render();break;
  case 'new-ex':exForm(null);break;
  case 'edit-ex':exForm(S.exercises.find(x=>x.id===d.id));break;
  case 'save-ex':{const n=$('#xn').value.trim();if(!n){toast('Name required');break}const o={name:n,type:$('#xt').value,muscle:$('#xm').value.trim(),machine:$('#xmach').checked,brand:$('#xb').value};
   if(d.id)Object.assign(S.exercises.find(x=>x.id===d.id),o);else S.exercises.push({id:uid(),...o});save();closeModal();render();break}
  case 'del-ex':S.exercises=S.exercises.filter(x=>x.id!==d.id);save();closeModal();render();break;
  case 'sadd':{const x=S.exercises.find(x=>x.id===d.id);getSettings(x,d.brand).push({k:'',v:''});save();render();
   const ls=document.querySelectorAll(`[data-f=slabel][data-id="${d.id}"][data-brand="${d.brand}"]`);if(ls.length)ls[ls.length-1].focus();break}
  case 'srm':{const x=S.exercises.find(x=>x.id===d.id);getSettings(x,d.brand).splice(+d.i,1);save();render();break}
  case 'import-routines':importForm();break;
  case 'do-import-routines':try{const st=importText($('#ta').value);if(!st.routines){toast('No exercises found – check the format');break}closeModal();render();toast(`Added ${st.routines} routine${st.routines>1?'s':''}, ${st.newEx} new exercise${st.newEx===1?'':'s'}`)}catch(_){toast('Could not read that – check the format')}break;
  case 'export':doExport();break;
  case 'import':doImport();break;
  case 'copy':{const t=$('#ta');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{document.execCommand('copy');toast('Copied')})}catch(_){try{document.execCommand('copy');toast('Copied')}catch(__){}}break}
  case 'do-import':try{const j=JSON.parse($('#ta').value);if(!j.exercises||!j.workouts)throw 0;S=j;S.settings=S.settings||{unit:'lb',rest:90};save();closeModal();toast('Imported');render()}catch(_){toast('Not a valid backup')}break;
 }
});
document.addEventListener('input',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 if(f==='set'){const s=S.active.entries[+t.dataset.ei].sets[+t.dataset.si];s[t.dataset.k]=t.value;save()}
 else if(f==='restdef'){S.settings.rest=Math.max(5,num(t.value)||90);save()}
 else if(f==='exfilter'){exFilter=t.value;const p=t.selectionStart;render();const n=$('[data-f=exfilter]');n.focus();n.setSelectionRange(p,p)}
 else if(f==='slabel'||f==='sval'){const x=S.exercises.find(x=>x.id===t.dataset.id);if(x){const r=getSettings(x,t.dataset.brand)[+t.dataset.i];if(r){r[f==='slabel'?'k':'v']=t.value;save()}}}
 else if(f==='pq')pickList(t.value);
 else if(f==='rsets'){rEdit.items[+t.dataset.n].sets=Math.max(1,parseInt(t.value)||1)}
});
document.addEventListener('change',e=>{const f=e.target.dataset.f;
 if(f==='statex'){statEx=e.target.value;render()}
 else if(f==='machtoggle'){$('#xbwrap').style.display=e.target.checked?'block':'none'}
 else if(f==='brand'){const en=S.active.entries[+e.target.dataset.ei],x=S.exercises.find(x=>x.id===en.ex);en.brand=e.target.value;if(x)x.brand=e.target.value;save();render()}});

migrate();
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
if(S.active)startElapsed();
</script>
